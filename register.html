<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名 — Skill Nexus 华为云共创计划</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand: #C00000;
            --brand-light: #FFE5E5;
            --accent: #1a1a2e;
            --text: #1a1a2e;
            --text-secondary: #6b7280;
            --surface: #ffffff;
            --bg: #fafafa;
            --border: #e5e7eb;
            --radius: 12px;
            --shadow: 0 4px 24px rgba(0,0,0,0.06);
            --font: 'Inter', 'Microsoft YaHei', -apple-system, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== Header ===== */
        .top-bar {
            background: var(--accent);
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-bar .logo {
            color: var(--surface);
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        .top-bar .logo span {
            color: var(--brand);
        }

        .top-bar .back-link {
            color: rgba(255,255,255,0.6);
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: color 0.3s;
        }

        .top-bar .back-link:hover {
            color: var(--surface);
        }

        /* ===== Main ===== */
        .main {
            flex: 1;
            display: flex;
            justify-content: center;
            padding: 60px 24px 80px;
        }

        .form-card {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 48px;
            width: 100%;
            max-width: 600px;
            border: 1px solid var(--border);
        }

        .form-card .badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--brand);
            margin-bottom: 8px;
        }

        .form-card h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .form-card .desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 36px;
            line-height: 1.7;
        }

        /* ===== Form ===== */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        .form-group label .required {
            color: var(--brand);
            margin-left: 2px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: var(--font);
            color: var(--text);
            background: var(--surface);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(192,0,0,0.1);
        }

        .form-group input.error,
        .form-group select.error {
            border-color: var(--brand);
            background: #fff5f5;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-group .error-msg {
            font-size: 12px;
            color: var(--brand);
            margin-top: 4px;
            display: none;
        }

        .form-group .error-msg.show {
            display: block;
        }

        /* ===== Checkboxes ===== */
        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            font-size: 14px;
            color: var(--text);
        }

        .checkbox-item:hover {
            border-color: var(--brand);
        }

        .checkbox-item input {
            width: auto;
            accent-color: var(--brand);
        }

        .checkbox-item.selected {
            border-color: var(--brand);
            background: var(--brand-light);
        }

        /* ===== Radio ===== */
        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            font-size: 14px;
        }

        .radio-item:hover {
            border-color: var(--brand);
        }

        .radio-item input {
            width: auto;
            accent-color: var(--brand);
        }

        .radio-item.selected {
            border-color: var(--brand);
            background: var(--brand-light);
        }

        /* ===== Submit ===== */
        .submit-btn {
            width: 100%;
            padding: 14px 24px;
            background: var(--brand);
            color: var(--surface);
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            transition: background 0.3s ease, transform 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            background: #a00000;
            transform: translateY(-1px);
        }

        .submit-btn:disabled {
            background: var(--border);
            cursor: not-allowed;
            transform: none;
        }

        /* ===== Success ===== */
        .success-state {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .success-state.show {
            display: block;
        }

        .success-state .icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: #d1fae5;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 28px;
        }

        .success-state h2 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .success-state p {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.7;
        }

        .success-state .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 32px;
            background: var(--accent);
            color: var(--surface);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            text-decoration: none;
            transition: background 0.3s;
        }

        .success-state .btn-back:hover {
            background: #2a2a3e;
        }

        /* form vs success */
        .form-content.hidden {
            display: none;
        }

        /* ===== Footer ===== */
        .footer {
            text-align: center;
            padding: 24px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        @media (max-width: 600px) {
            .form-card { padding: 28px 20px; }
            .checkbox-grid { grid-template-columns: 1fr; }
            .top-bar { padding: 14px 20px; }
            .main { padding: 40px 16px 60px; }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <a href="nexus.html" class="logo">Skill <span>Nexus</span></a>
        <a href="nexus.html" class="back-link">← 返回首页</a>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="form-card">

            <!-- Form Content -->
            <div class="form-content" id="formContent">
                <div class="badge">Skill Nexus</div>
                <h1>成为华为云Skill Nexus Co-Builder</h1>
                <p class="desc">填写以下信息，我们会将你拉入对应的开发者社群，开启 Skill 共创之旅。</p>

                <form id="applyForm" novalidate>

                    <!-- 姓名 -->
                    <div class="form-group">
                        <label>联系人名称 <span class="required">*</span></label>
                        <input type="text" id="name" placeholder="请输入您的姓名" required>
                        <div class="error-msg" id="nameError">请输入联系人名称</div>
                    </div>

                    <!-- 电话 -->
                    <div class="form-group">
                        <label>联系电话 <span class="required">*</span></label>
                        <input type="tel" id="phone" placeholder="请留下您的手机号，专属顾问会尽快联系您" required>
                        <div class="error-msg" id="phoneError">请输入联系电话</div>
                    </div>

                    <!-- 邮箱 -->
                    <div class="form-group">
                        <label>邮箱 <span class="required">*</span></label>
                        <input type="email" id="email" placeholder="请留下您的工作邮箱地址" required>
                        <div class="error-msg" id="emailError">请输入有效的邮箱地址</div>
                    </div>

                    <!-- 公司 -->
                    <div class="form-group">
                        <label>所在公司/团队 <span class="required">*</span></label>
                        <input type="text" id="company" placeholder="如为个人开发者，请填写「个人」" required>
                        <div class="error-msg" id="companyError">请输入所在公司或团队</div>
                    </div>

                    <!-- 角色 -->
                    <div class="form-group">
                        <label>您的职位/角色 <span class="required">*</span></label>
                        <input type="text" id="role" placeholder="如：产品经理、后端开发、架构师、独立开发者等" required>
                        <div class="error-msg" id="roleError">请输入职位或角色</div>
                    </div>

                    <!-- 意向场景 -->
                    <div class="form-group">
                        <label>意向场景方向 <span class="required">*</span>（可多选）</label>
                        <div class="checkbox-grid" id="sceneGroup">
                            <label class="checkbox-item">
                                <input type="checkbox" value="安全与身份">
                                安全与身份
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="可观测与诊断">
                                可观测与诊断
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="成本治理">
                                成本治理
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="资源管理与编排">
                                资源管理与编排
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="DevOps与发布">
                                DevOps 与发布
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="智能运维(AIOps)">
                                智能运维 (AIOps)
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="Skill规范与标准">
                                Skill 规范与标准
                            </label>
                            <label class="checkbox-item">
                                <input type="checkbox" value="其他">
                                其他
                            </label>
                        </div>
                        <div class="error-msg" id="sceneError">请至少选择一个场景方向</div>
                    </div>

                    <!-- 是否华为云客户 -->
                    <div class="form-group">
                        <label>是否华为云客户 <span class="required">*</span></label>
                        <div class="radio-group" id="customerGroup">
                            <label class="radio-item">
                                <input type="radio" name="customer" value="yes" required>
                                是，已经在使用华为云
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="customer" value="plan" required>
                                否，但有计划接入
                            </label>
                            <label class="radio-item">
                                <input type="radio" name="customer" value="no" required>
                                暂不涉及，仅个人开发者参与
                            </label>
                        </div>
                        <div class="error-msg" id="customerError">请选择是否华为云客户</div>
                    </div>

                    <button type="submit" class="submit-btn">提交报名 →</button>
                </form>
            </div>

            <!-- Success State -->
            <div class="success-state" id="successState">
                <div class="icon">✓</div>
                <h2>报名提交成功</h2>
                <p>
                    感谢你对 Skill Nexus 的关注与支持！<br>
                    我们会在 3 个工作日内与你取得联系，<br>
                    并将你邀请进入专属开发者社群。
                </p>
                <a href="nexus.html" class="btn-back">← 返回首页</a>
            </div>

        </div>
    </div>

    <div class="footer">
        © 2026 华为云 Skill Nexus 共创计划
    </div>

    <script>
        // Radio item highlight
        document.querySelectorAll('.radio-item input').forEach(input => {
            input.addEventListener('change', function() {
                this.closest('.radio-group').querySelectorAll('.radio-item').forEach(item => {
                    item.classList.toggle('selected', item.querySelector('input').checked);
                });
            });
        });

        // Checkbox item highlight
        document.querySelectorAll('.checkbox-item input').forEach(input => {
            input.addEventListener('change', function() {
                this.closest('.checkbox-item').classList.toggle('selected', this.checked);
            });
        });

        // Form validation & submit
        document.getElementById('applyForm').addEventListener('submit', function(e) {
            e.preventDefault();

            let valid = true;

            // Helper: validate field
            function validateField(id, errorId, condition) {
                const field = document.getElementById(id);
                const error = document.getElementById(errorId);
                if (!condition) {
                    field.classList.add('error');
                    error.classList.add('show');
                    valid = false;
                } else {
                    field.classList.remove('error');
                    error.classList.remove('show');
                }
            }

            // Name
            validateField('name', 'nameError', document.getElementById('name').value.trim().length > 0);

            // Phone
            validateField('phone', 'phoneError', document.getElementById('phone').value.trim().length > 0);

            // Email
            const email = document.getElementById('email').value.trim();
            validateField('email', 'emailError', /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email));

            // Company
            validateField('company', 'companyError', document.getElementById('company').value.trim().length > 0);

            // Role
            validateField('role', 'roleError', document.getElementById('role').value.trim().length > 0);

            // Scene (checkbox, at least one)
            const sceneChecked = document.querySelectorAll('#sceneGroup input:checked');
            const sceneError = document.getElementById('sceneError');
            if (sceneChecked.length === 0) {
                sceneError.classList.add('show');
                valid = false;
            } else {
                sceneError.classList.remove('show');
            }

            // Customer (radio)
            const customerChecked = document.querySelector('input[name="customer"]:checked');
            const customerError = document.getElementById('customerError');
            if (!customerChecked) {
                customerError.classList.add('show');
                valid = false;
            } else {
                customerError.classList.remove('show');
            }

            if (!valid) {
                // Scroll to first error
                const firstError = document.querySelector('.error-msg.show');
                if (firstError) {
                    firstError.closest('.form-group')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
                return;
            }

            // Success
            document.getElementById('formContent').classList.add('hidden');
            document.getElementById('successState').classList.add('show');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });
    </script>

</body>
</html>
